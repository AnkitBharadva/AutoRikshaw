<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Rickshaw — Ahmedabad</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@700;900&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/jpeg" href="logo.jpg">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Rain Overlay -->
    <div class="rain-overlay"></div>
    <div class="vignette"></div>

    <!-- Top Header -->
    <header class="top-header">
        <div class="header-left">
            <div class="logo-icon">
                <img src="logo.jpg" alt="Auto Rickshaw Logo" class="header-logo-img">
            </div>
            <div class="header-titles">
                <h1>ઓટો રિક્ષા</h1>
                <p>NH 147 &middot; Sarkhej&ndash;Gandhinagar Highway</p>
            </div>
        </div>
        
        <div class="header-right" style="position: relative;">
            <div class="clock" id="clock">14:11 <span class="seconds">39</span></div>
            <div class="passengers">&bull; 3 PASSENGERS</div>
            <button class="profile-btn" id="profile-btn">
                <div class="avatar">👨🏽‍✈️</div>
                Who's driving?
            </button>
            
            <!-- Rickshaw Meter Dropdown -->
            <div class="meter-box" id="meter-box">
                <div class="meter-header">
                    <span class="meter-title">FARE METER</span>
                    <span class="meter-status">HIRED</span>
                </div>
                <div class="meter-display">
                    <span class="currency">₹</span>
                    <span class="amount">Ankit</span>
                </div>
                <div class="social-links" onclick="event.stopPropagation();">
                    <a href="https://www.linkedin.com/in/ankit-bharadva/" target="_blank" rel="noopener noreferrer" class="social-btn li-btn">
                        <svg style="pointer-events: none;" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                            <path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/>
                        </svg>
                        LinkedIn
                    </a>
                    <a href="https://www.instagram.com/ankit_bharadva/" target="_blank" rel="noopener noreferrer" class="social-btn ig-btn">
                        <svg style="pointer-events: none;" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                            <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
                        </svg>
                        Instagram
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Center Content -->
    <main class="center-content">
        <div class="track-info-top">
                અમદાવાદ માં એકલો ફરુ
            </div>
        <h1 class="huge-title">ઓટો રિક્ષા</h1>
    </main>

    <!-- Bottom Player -->
    <div class="player-container">
        <div class="player-extras">
            
            
            <button class="horn-btn">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                    <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                </svg>
                <div class="horn-text">
                    <div class="horn-hi">હૉર્ન ઓકે પ્લીઝ</div>
                    <div class="horn-en">HORN OK PLEASEEEE</div>
                </div>
            </button>
        </div>
        <div class="player">
            <div class="album-art-container">
                <div class="album-art" style="background-image: none; background-color: rgba(255, 184, 0, 0.1);"></div>
                <div class="vinyl-hole"></div>
            </div>
            
            <div class="track-details">
                <h3 class="track-title">Loading...</h3>
                <p class="track-artist">Gujarati Playlist</p>
                
                <div class="timeline">
                    <span class="time current-time">0:00</span>
                    <div class="progress-bar">
                        <div class="progress" style="width: 0%;"></div>
                    </div>
                    <span class="time total-time">0:00</span>
                </div>
            </div>

            <div class="player-controls">
                <!-- Shuffle -->
                <button class="icon-btn">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
                </button>
                <!-- Prev -->
                <button class="icon-btn">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                </button>
                <!-- Play/Pause -->
                <button class="play-btn-main">
                    <svg viewBox="0 0 24 24" width="28" height="28" fill="#111"><path d="M8 5v14l11-7z"/></svg>
                </button>
                <!-- Next -->
                <button class="icon-btn">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                </button>
                <!-- Playlist Menu -->
                <button class="icon-btn playlist-btn">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M4 10h12v2H4zm0-4h12v2H4zm0 8h8v2H4zm10 0v6l5-3z"/></svg>
                </button>
                <!-- Volume -->
                <div class="volume-container">
                    <button class="icon-btn volume-btn">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
                    </button>
                    <input type="range" class="volume-slider" id="volume-slider" min="0" max="100" value="100">
                </div>
            </div>
        </div>

        <div class="shortcuts">
            <div class="shortcut-group"><span class="key">Space</span> PLAY / PAUSE</div>
            <div class="shortcut-group"><span class="key">&larr;</span> <span class="key">&rarr;</span> SEEK</div>
            <div class="shortcut-group"><span class="key">N</span> <span class="key">P</span> TRACK</div>
            <div class="shortcut-group"><span class="key">H</span> HORN</div>
        </div>

        <button class="lang-toggle" id="lang-toggle">
            <span class="lang-text" id="lang-text">अरे चाचा कुछ दिल को लगे ऐसा बजाओ ना</span>
            <span class="lang-indicator" id="lang-indicator">ગુજરાતી</span>
        </button>
    </div>

    <!-- Hidden YouTube Player -->
    <div id="yt-player-container" style="position: absolute; left: -9999px; width: 200px; height: 200px; overflow: hidden;">
        <div id="yt-player"></div>
    </div>

    <!-- Playlist Modal -->
    <div class="playlist-modal" id="playlist-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Playlist Settings</h2>
                <button class="close-modal">&times;</button>
            </div>
            
            <div class="modal-section">
                <h3>Load New Playlist</h3>
                <div class="input-group">
                    <input type="text" id="playlist-input" placeholder="YouTube Playlist ID or URL...">
                    <button id="load-playlist-btn">Load</button>
                </div>
            </div>

            <div class="modal-section">
                <h3>Current Tracks (<span id="track-count">0</span>)</h3>
                <div class="track-list" id="track-list">
                    <!-- Tracks will be listed here -->
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
